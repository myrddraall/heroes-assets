name: Update live

# Daily: rebuilds live/ when the live game server has a new version, then releases and deploys it
# (update.yml). Run it by hand to check now, or with "rebuild" after a tool fix.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Rebuild even if the game has not changed (a tool fix: the next revision)'
        type: boolean
        default: false

# One update at a time, start to finish: both channels commit versions.yml and share the release PR
concurrency:
  group: heroes-assets-update
  cancel-in-progress: false

jobs:
  update:
    uses: ./.github/workflows/update.yml
    permissions:
      contents: write
      pull-requests: write
      packages: read
      actions: write
    with:
      channel: live
      rebuild: ${{ inputs.rebuild == true }}
