name: Update PTR

# Daily: rebuilds ptr/ when the PTR server has a new version, then releases and deploys it
# (update.yml). Run it by hand to check now, or with "rebuild" after a tool fix.

on:
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Rebuild even if the game has not changed (a tool fix: the next revision)'
        type: boolean
        default: false

jobs:
  update:
    uses: ./.github/workflows/update.yml
    permissions:
      contents: write
      pull-requests: write
      packages: read
      actions: write
    with:
      channel: ptr
      rebuild: ${{ inputs.rebuild == true }}
