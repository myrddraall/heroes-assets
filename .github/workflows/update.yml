name: Update

# Rebuilds one channel's folder when its game server has a new version (or when a rebuild is
# asked for), then releases and deploys it without a person in the loop.
#
#   plan     what's left to do, from where things stand (tools/plan.ts)
#   extract  Heroes Data Parser, one job per locale in parallel; HDP itself and its download cache
#            of game files kept in the Actions cache
#   publish  one update at a time, across both channels (they share versions.yml and the release
#            PR): a new extraction stored in sources/ (the build it replaces kept as a patch); the
#            folder built from the stored extraction, and every past build into <channel>/history
#            (tools/build-history.ts); committed to main; git-flow's release PR opened, merged and
#            published; the release deployed to Pages
#
# Every stage is skipped when it's done already, so after a failure "Re-run failed jobs" (or a
# new run) carries on where the last one stopped. Both channels plan and extract at the same time;
# only publishing waits its turn. A workflow's own pushes and merges start no other workflows but
# its dispatches do, so the git-flow workflows are dispatched and waited for.
#
# Called by update-live.yml and update-ptr.yml.

on:
  workflow_call:
    inputs:
      channel:
        description: 'live or ptr'
        required: true
        type: string
      rebuild:
        description: 'Rebuild even if the game has not changed (a tool fix: the next revision)'
        required: false
        type: boolean
        default: false

env:
  CHANNEL: ${{ inputs.channel }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      game: ${{ steps.plan.outputs.game }}
      revision: ${{ steps.plan.outputs.revision }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      extract: ${{ steps.plan.outputs.extract }}
      build: ${{ steps.plan.outputs.build }}
      release: ${{ steps.plan.outputs.release }}
      deploy: ${{ steps.plan.outputs.deploy }}
      locales: ${{ steps.plan.outputs.locales }}
      hdp: ${{ steps.plan.outputs.hdp }}
    steps:
      # the tools and the folders' versions only, not the folders
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/
            /package.json
            /ui-sheets/
            /live/version.json
            /ptr/version.json
            /sources/*/latest/meta.json

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Plan
        id: plan
        run: node tools/plan.ts "$CHANNEL" ${{ inputs.rebuild && '--rebuild' || '' }}

  extract:
    needs: plan
    if: needs.plan.outputs.extract == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        locale: ${{ fromJSON(needs.plan.outputs.locales) }}
    env:
      HEROESDATAPARSER_DATA_DIR: ${{ github.workspace }}/hdp-data
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/
            /package.json
            /ui-sheets/

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Heroes Data Parser
        uses: actions/cache@v4
        with:
          path: hdp
          key: hdp-${{ needs.plan.outputs.hdp }}

      # Game files HDP downloaded: the main locale's run also reads the pictures, so it keeps its own
      - name: Game files
        uses: actions/cache@v4
        with:
          path: hdp-data/casclib-cache
          key: casc-${{ inputs.channel }}-${{ needs.plan.outputs.game }}-${{ matrix.locale == 'enus' && 'main' || 'strings' }}
          restore-keys: |
            casc-${{ inputs.channel }}-${{ needs.plan.outputs.game }}-
            casc-${{ inputs.channel }}-

      - name: Extract
        run: node tools/extract.ts "$CHANNEL" "${{ matrix.locale }}" "${{ needs.plan.outputs.game }}" hdp-out

      # only until publish has it; the extraction is kept on the release
      - uses: actions/upload-artifact@v4
        with:
          name: hdp-${{ matrix.locale }}
          path: hdp-out/
          retention-days: 1

  publish:
    needs: [plan, extract]
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.extract.result == 'success' || needs.extract.result == 'skipped') &&
      (needs.plan.outputs.build == 'true' || needs.plan.outputs.release == 'true' ||
       needs.plan.outputs.deploy == 'true')
    runs-on: ubuntu-latest
    concurrency:
      group: heroes-assets-publish
      cancel-in-progress: false
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      GAME: ${{ needs.plan.outputs.game }}
    steps:
      # main's tip when the turn comes: the other channel may have published meanwhile
      - uses: actions/checkout@v7
        with:
          ref: main

      - if: needs.plan.outputs.build == 'true'
        uses: pnpm/action-setup@v6

      - if: needs.plan.outputs.build == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        if: needs.plan.outputs.build == 'true'
        run: |
          pnpm config set "//npm.pkg.github.com/:_authToken" "$GH_TOKEN"
          pnpm install --frozen-lockfile

      - name: Gather the extraction
        if: needs.plan.outputs.extract == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: hdp-*
          path: hdp-out
          merge-multiple: true

      - name: Store the extraction
        if: needs.plan.outputs.extract == 'true'
        run: node tools/store-extraction.ts "$CHANNEL" "$GAME" hdp-out

      - name: Build the folder and its history
        if: needs.plan.outputs.build == 'true'
        run: |
          # the folder as it was: when the same tools built its history, only what changes is redone
          cp -r "$CHANNEL" "$RUNNER_TEMP/previous"
          node tools/restore-extraction.ts "$CHANNEL" latest "$RUNNER_TEMP/latest"
          node tools/build-channel.ts "$CHANNEL" "$RUNNER_TEMP/latest"
          node tools/build-history.ts "$CHANNEL" "$RUNNER_TEMP/previous"
          node tools/set-version.ts "$CHANNEL" "$GAME" "${{ needs.plan.outputs.revision }}"

      - name: Commit and push
        if: needs.plan.outputs.build == 'true'
        env:
          REVISION: ${{ needs.plan.outputs.revision }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          git add "$CHANNEL" sources files .publish/versions.yml
          if git diff --cached --quiet; then
            echo "main already holds this build"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          what=$([ "$REVISION" = 0 ] && echo "game $GAME" || echo "game $GAME, rebuild $REVISION")
          git commit -m "feat($CHANNEL): $what" -m "Release $VERSION."
          git push origin HEAD:main

      - name: Release
        if: needs.plan.outputs.release == 'true'
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "$TAG is released already"
            exit 0
          fi
          tip=$(git rev-parse HEAD)
          # a release PR of main's tip merged by an earlier attempt, whose publish failed
          pr=$(gh pr list --base release/main --head main --state merged --limit 10 \
            --json number,headRefOid --jq "map(select(.headRefOid == \"$tip\")) | .[0].number // empty")
          if [ -z "$pr" ]; then
            tools/await-run.sh create-release-pr.yml main
            pr=$(gh pr list --base release/main --head main --state open \
              --json number --jq '.[0].number // empty')
            [ -n "$pr" ] || { echo "::error::No open release PR from main"; exit 1; }
            # git-flow opens release PRs as drafts, for a person to review; here the update is the review
            if [ "$(gh pr view "$pr" --json isDraft --jq .isDraft)" = true ]; then gh pr ready "$pr"; fi
            gh pr merge "$pr" --merge
          fi
          echo "Publishing release PR #$pr"
          tools/await-run.sh build-pack-publish.yml release/main -f pr_number="$pr"
          gh release view "$TAG" --json tagName > /dev/null

      - name: Deploy
        if: needs.plan.outputs.deploy == 'true'
        run: |
          tools/await-run.sh deploy-production.yml main -f release_id="$TAG"
          echo "Deployed $TAG" >> "$GITHUB_STEP_SUMMARY"
