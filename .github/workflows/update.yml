name: Update

# Rebuilds one channel's folder when its game server has a new version (or when a rebuild is
# asked for), then releases and deploys it without a person in the loop.
#
#   plan     what's left to do, from where things stand (tools/plan.ts)
#   extract  Heroes Data Parser, one job per locale in parallel; its download cache of game files
#            kept in the Actions cache
#   build    the folder from the extraction (or from the one stored on the last release of the
#            same game build, when a rebuild can reuse it), committed to main
#   release  git-flow's release PR opened, merged, published; the extraction stored on the release
#   deploy   the release deployed to Pages
#
# Every stage is skipped when it's done already, so after a failure "Re-run failed jobs" (or a
# new run) carries on where the last one stopped. A workflow's own pushes and merges start no
# other workflows but its dispatches do, so the git-flow workflows are dispatched and waited for.
#
# Called by update-live.yml and update-ptr.yml.

on:
  workflow_call:
    inputs:
      channel:
        description: 'live or ptr'
        required: true
        type: string
      rebuild:
        description: 'Rebuild even if the game has not changed (a tool fix: the next revision)'
        required: false
        type: boolean
        default: false

env:
  CHANNEL: ${{ inputs.channel }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      game: ${{ steps.plan.outputs.game }}
      revision: ${{ steps.plan.outputs.revision }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      extract: ${{ steps.plan.outputs.extract }}
      build: ${{ steps.plan.outputs.build }}
      release: ${{ steps.plan.outputs.release }}
      deploy: ${{ steps.plan.outputs.deploy }}
      snapshot: ${{ steps.plan.outputs.snapshot }}
      snapshot_name: ${{ steps.plan.outputs.snapshot_name }}
      locales: ${{ steps.plan.outputs.locales }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Plan
        id: plan
        run: node tools/plan.ts "$CHANNEL" ${{ inputs.rebuild && '--rebuild' || '' }}

  extract:
    needs: plan
    if: needs.plan.outputs.extract == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        locale: ${{ fromJSON(needs.plan.outputs.locales) }}
    env:
      HEROESDATAPARSER_DATA_DIR: ${{ github.workspace }}/hdp-data
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Game files HDP downloaded: the main locale's run also reads the pictures, so it keeps its own
      - uses: actions/cache@v4
        with:
          path: hdp-data/casclib-cache
          key: casc-${{ inputs.channel }}-${{ needs.plan.outputs.game }}-${{ matrix.locale == 'enus' && 'main' || 'strings' }}
          restore-keys: |
            casc-${{ inputs.channel }}-${{ needs.plan.outputs.game }}-
            casc-${{ inputs.channel }}-

      - name: Extract
        run: node tools/extract.ts "$CHANNEL" "${{ matrix.locale }}" "${{ needs.plan.outputs.game }}" hdp-out

      - uses: actions/upload-artifact@v4
        with:
          name: hdp-${{ matrix.locale }}
          path: hdp-out/
          retention-days: 7

  build:
    needs: [plan, extract]
    if: >-
      always() && needs.plan.outputs.build == 'true' &&
      (needs.extract.result == 'success' || needs.extract.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: |
          pnpm config set "//npm.pkg.github.com/:_authToken" "$GH_TOKEN"
          pnpm install --frozen-lockfile

      - name: Gather the extraction
        if: needs.plan.outputs.extract == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: hdp-*
          path: hdp-out
          merge-multiple: true

      - name: Take the stored extraction
        if: needs.plan.outputs.extract != 'true'
        env:
          SNAPSHOT: ${{ needs.plan.outputs.snapshot }}
          NAME: ${{ needs.plan.outputs.snapshot_name }}
        run: |
          gh release download "$SNAPSHOT" --pattern "$NAME" --dir .
          mkdir -p hdp-out && tar xzf "$NAME" -C hdp-out && rm "$NAME"

      - name: Build the folder
        run: |
          node tools/build-channel.ts "$CHANNEL" hdp-out
          node tools/set-version.ts "$CHANNEL" "${{ needs.plan.outputs.game }}" \
            "${{ needs.plan.outputs.revision }}"

      - name: Keep the extraction for the release
        if: needs.plan.outputs.extract == 'true'
        run: tar czf "${{ needs.plan.outputs.snapshot_name }}" -C hdp-out .

      - if: needs.plan.outputs.extract == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: ${{ needs.plan.outputs.snapshot_name }}
          compression-level: 0
          retention-days: 7

      - name: Commit and push
        env:
          GAME: ${{ needs.plan.outputs.game }}
          REVISION: ${{ needs.plan.outputs.revision }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          git add "$CHANNEL" .publish/versions.yml
          if git diff --cached --quiet; then
            echo "main already holds this build"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          what=$([ "$REVISION" = 0 ] && echo "game $GAME" || echo "game $GAME, rebuild $REVISION")
          git commit -m "feat($CHANNEL): $what" -m "Release $VERSION."
          git push origin HEAD:main

  release:
    needs: [plan, build]
    if: >-
      always() && needs.plan.outputs.release == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Publish
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "$TAG is released already"
            exit 0
          fi
          tip=$(git rev-parse HEAD)
          # a release PR of main's tip merged by an earlier attempt, whose publish failed
          pr=$(gh pr list --base release/main --head main --state merged --limit 10 \
            --json number,headRefOid --jq "map(select(.headRefOid == \"$tip\")) | .[0].number // empty")
          if [ -z "$pr" ]; then
            tools/await-run.sh create-release-pr.yml main
            pr=$(gh pr list --base release/main --head main --state open \
              --json number --jq '.[0].number // empty')
            [ -n "$pr" ] || { echo "::error::No open release PR from main"; exit 1; }
            # git-flow opens release PRs as drafts, for a person to review; here the update is the review
            if [ "$(gh pr view "$pr" --json isDraft --jq .isDraft)" = true ]; then gh pr ready "$pr"; fi
            gh pr merge "$pr" --merge
          fi
          echo "Publishing release PR #$pr"
          tools/await-run.sh build-pack-publish.yml release/main -f pr_number="$pr"
          gh release view "$TAG" --json tagName > /dev/null

      - name: Fetch the extraction
        id: snapshot
        if: needs.plan.outputs.extract == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: snapshot

      # Kept only on the newest release of each channel: a rebuild of that game build reuses it
      - name: Store the extraction on the release
        if: steps.snapshot.outcome == 'success'
        env:
          NAME: ${{ needs.plan.outputs.snapshot_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$NAME" --clobber
          gh release list --limit 200 --json tagName --jq '.[].tagName' | while read -r tag; do
            [ "$tag" = "$TAG" ] && continue
            case "$tag" in
              *-ptr) [ "$CHANNEL" = ptr ] || continue ;;
              *) [ "$CHANNEL" = live ] || continue ;;
            esac
            gh release view "$tag" --json assets --jq '.assets[].name' | grep "^hdp-$CHANNEL-" |
              while read -r old; do gh release delete-asset "$tag" "$old" --yes; done || true
          done

  deploy:
    needs: [plan, release]
    if: >-
      always() && needs.plan.outputs.deploy == 'true' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Deploy
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          tools/await-run.sh deploy-production.yml main -f release_id="$TAG"
          echo "Deployed $TAG" >> "$GITHUB_STEP_SUMMARY"
